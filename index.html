<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

</head>
<body>
<title>Konrads Trainingsbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: eine Handy-Spalte (max. 560px), feste Tab-Leiste unten, Karten nur für Übungen und Einträge */
:root {
  --bg: #eef0ee;
  --surface: #fbfcfb;
  --sunk: #e3e7e4;
  --line: #cfd6d1;
  --fg: #16201b;
  --muted: #5b6862;
  --accent: #1f5fd1;
  --accent-ink: #ffffff;
  --good: #1d7a46;
  --warn: #9a5b00;
  --warn-bg: #fff2d9;
  --bad: #b3261e;
  --d1: #d9433b; --d2: #2f7fd8; --d3: #2e9d5b; --d4: #1495b8; --d5: #8b4fd6; --d6: #c99106;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.t-light) {
    --bg: #0f1412; --surface: #171e1b; --sunk: #202925; --line: #2d3833; --fg: #e8eeea; --muted: #9aa8a1;
    --accent: #7ea6ff; --accent-ink: #0b1430; --good: #5fd08f; --warn: #f0b04a; --warn-bg: #33270f; --bad: #ff8a80;
    --d1: #ff6b62; --d2: #63a6ff; --d3: #5cc98a; --d4: #4cc3e3; --d5: #b58cff; --d6: #f2c94c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"], :root.t-dark {
  --bg: #0f1412; --surface: #171e1b; --sunk: #202925; --line: #2d3833; --fg: #e8eeea; --muted: #9aa8a1;
  --accent: #7ea6ff; --accent-ink: #0b1430; --good: #5fd08f; --warn: #f0b04a; --warn-bg: #33270f; --bad: #ff8a80;
  --d1: #ff6b62; --d2: #63a6ff; --d3: #5cc98a; --d4: #4cc3e3; --d5: #b58cff; --d6: #f2c94c;
  color-scheme: dark;
}
:root.t-light {
  --bg: #eef0ee; --surface: #fbfcfb; --sunk: #e3e7e4; --line: #cfd6d1; --fg: #16201b; --muted: #5b6862;
  --accent: #1f5fd1; --accent-ink: #ffffff; --good: #1d7a46; --warn: #9a5b00; --warn-bg: #fff2d9; --bad: #b3261e;
  --d1: #d9433b; --d2: #2f7fd8; --d3: #2e9d5b; --d4: #1495b8; --d5: #8b4fd6; --d6: #c99106;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
}
.wrap { width: 100%; max-width: 560px; margin: 0 auto; display: grid; gap: 18px; min-width: 0; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 18px 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: .01em; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 600; }
.sub { color: var(--muted); font-size: 14px; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; font-weight: 600; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
section { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid3.when { grid-template-columns: 1.5fr 1fr 1fr; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
label.f { display: grid; gap: 4px; font-size: 14px; color: var(--muted); min-width: 0; }
input, select, textarea {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 10px; width: 100%; min-width: 0; font-size: 16px;
}
textarea { min-height: 70px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 9px 14px; font-weight: 600; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
button.danger { color: var(--bad); }
button.big { width: 100%; padding: 13px; font-size: 17px; }
button:disabled { opacity: .5; cursor: default; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 8px 6px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); padding: 8px 0 6px; display: grid; justify-items: center; gap: 2px; border-radius: 8px; color: var(--fg); }
.day b { font-family: var(--font-display); font-size: 20px; line-height: 1; }
.day span { font-size: 11px; color: var(--muted); font-weight: 500; }
.day.off { opacity: .45; }
.day[aria-pressed="true"] { border-color: var(--dc); box-shadow: inset 0 -4px 0 var(--dc); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dc); flex: none; }
.daytag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.slot { border-left: 4px solid var(--dc); }
.slothead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.target { font-family: var(--font-display); font-weight: 600; font-size: 17px; white-space: nowrap; }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 34px 1fr 1fr 34px; gap: 8px; align-items: center; }
.set .n { font-family: var(--font-display); font-weight: 600; color: var(--muted); text-align: center; }
.set button { padding: 6px 0; color: var(--muted); }
.sethead { display: grid; grid-template-columns: 34px 1fr 1fr 34px; gap: 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.hint { font-size: 14px; color: var(--muted); }
.hint.up { color: var(--good); font-weight: 600; }
.banner { background: var(--warn-bg); color: var(--fg); border: 1px solid var(--warn); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; }
.banner strong { color: var(--warn); }
.notice { background: var(--sunk); border-radius: var(--radius); padding: 12px 14px; font-size: 15px; }
.list { display: grid; gap: 8px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; cursor: pointer; text-align: left; font-weight: 400; width: 100%; }
.entry .meta { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.entry .when { font-size: 14px; color: var(--muted); }
.detail { display: grid; gap: 6px; font-size: 15px; }
.detail table { border-collapse: collapse; width: 100%; }
.detail td { padding: 3px 0; vertical-align: top; }
.detail td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.imgs { display: flex; gap: 8px; flex-wrap: wrap; }
.imgs figure { margin: 0; position: relative; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--sunk); }
.imgs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.imgs figure button { position: absolute; top: 4px; right: 4px; padding: 0 7px; font-size: 14px; line-height: 22px; }
.imgs.big figure { width: 100%; height: auto; }
.imgs.big img { height: auto; }
details > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 15px; z-index: 30; max-width: calc(100% - 32px); }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { border: 0; background: transparent; border-radius: 0; padding: 8px 2px 10px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: 12px; font-weight: 600; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.banner.good { background: var(--sunk); border-color: var(--good); }
.banner.good strong { color: var(--good); }
.banner ul { margin: 6px 0 0; padding-left: 20px; }
.stat small { font-size: 16px; color: var(--muted); }
.stats.four { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 420px) { .stats.four { grid-template-columns: repeat(2, 1fr); } }
.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart svg { display: block; overflow: visible; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.chart .tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; line-height: 1.35; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; z-index: 2; }
.chart .legend { position: absolute; left: 4px; bottom: 0; display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.chart .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.big-num { font-family: var(--font-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.pill.up { color: var(--good); }
.pill.down { color: var(--bad); }
.rec h3 { font-size: 17px; }
.recs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.recs div { background: var(--sunk); border-radius: 8px; padding: 8px 10px; display: grid; }
.recs b { font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.recs span { font-size: 13px; color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cwd { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.cday { padding: 6px 0 4px; display: grid; justify-items: center; gap: 3px; min-height: 46px; font-weight: 500; border-color: transparent; background: var(--sunk); }
.cday.today { border-color: var(--accent); }
/* Je mehr Einheiten an einem Tag, desto kräftiger die Farbe */
.cday.n1 { background: color-mix(in srgb, var(--accent) 20%, var(--sunk)); }
.cday.n2 { background: color-mix(in srgb, var(--accent) 48%, var(--sunk)); }
.cday.n3 { background: color-mix(in srgb, var(--accent) 78%, var(--sunk)); color: var(--accent-ink); }
.cday.n2 .cdots i, .cday.n3 .cdots i { box-shadow: 0 0 0 1.5px var(--surface); }
.cday.cday[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.cday[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.cdots { display: flex; gap: 3px; height: 8px; }
.cdots i { width: 7px; height: 7px; border-radius: 50%; }
table.ov th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; padding: 0 0 4px 10px; }
table.ov td { text-align: right; padding-left: 10px; }
table.ov td:first-child { text-align: left; padding-left: 0; }
.copy-last { border-style: dashed; border-color: var(--accent); color: var(--accent); }
.mbars { display: grid; gap: 10px; }
.mrow { display: grid; grid-template-columns: 96px 1fr 52px; gap: 10px; align-items: center; font-size: 14px; }
.mname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mtrack { position: relative; height: 14px; background: var(--sunk); border-radius: 4px; }
.mzone { position: absolute; top: 0; bottom: 0; background: var(--line); opacity: .7; }
.mfill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; }
.mplan { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--fg); }
.mval { text-align: right; font-weight: 600; }
.mval small { color: var(--muted); font-weight: 400; }
.legend-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend-row i { display: inline-block; width: 12px; height: 8px; margin-right: 4px; border-radius: 2px; vertical-align: 0; }
.legend-row .lf { background: var(--accent); }
.legend-row .lp { background: var(--fg); width: 2px; height: 12px; }
.legend-row .lz { background: var(--line); }
.ready { position: fixed; z-index: 25; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: 528px; margin: 0 auto; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 6px 24px rgb(0 0 0 / .18); font-size: 15px; overflow-wrap: anywhere; }
.ready[hidden] { display: none; }
.pslot { border-left: 4px solid var(--dc); padding: 4px 0 8px 12px; display: grid; gap: 8px; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 1px dashed var(--line); border-radius: var(--radius); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { padding: 6px 12px; border-radius: 999px; font-size: 14px; }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: pop .18s ease-out; } @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Trainingsbuch</h1>
    <span class="sub" id="status">Lädt …</span>
  </header>
  <main id="main" class="wrap" style="gap:22px">
    <div class="empty">Deine Trainings werden geladen. Danach kannst du über „Eintragen“ dein erstes Training nachtragen.</div>
  </main>
</div>

<nav class="tabs" aria-label="Bereiche">
  <div class="in">
    <button data-tab="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Start</button>
    <button data-tab="eintragen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Eintragen</button>
    <button data-tab="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></svg>Verlauf</button>
    <button data-tab="fortschritt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Fortschritt</button>
    <button data-tab="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Mehr</button>
  </div>
</nav>
<div id="toast" class="toast" hidden></div>
<div id="ready" class="ready" hidden><span id="ready-t"></span><div class="row"><button class="primary" data-ready-go>Teilen / Sichern</button><button data-ready-x aria-label="Schließen">✕</button></div></div>

<script>
// ---------- Trainingsplan (aus Konrads Bild) ----------
const DEFAULT_PLAN = [
  { day: 1, name: "Brust & Rücken", slots: [
    { label: "Brust (schwer, Push)", sets: 4, reps: "6–8", opts: ["Bankdrücken (Langhantel)", "Schrägbankdrücken (Kurzhantel)", "Brustpresse (Maschine)", "Dips (Brustfokus)"] },
    { label: "Rücken (schwer, Pull)", sets: 4, reps: "6–8", opts: ["Klimmzüge", "Langhantelrudern", "Latzug (breit)", "T-Bar-Rudern"] },
    { label: "Brust (Isolation)", sets: 3, reps: "10–12", opts: ["Butterfly (Maschine)", "Kabelzug-Crossover", "Kurzhantel-Flys"] },
    { label: "Rücken (Isolation)", sets: 3, reps: "10–12", opts: ["Überzüge am Kabel (gestreckte Arme)", "Einarmiges Kurzhantelrudern", "Rudern am Kabel (eng)"] },
    { label: "Nacken (Isolation)", sets: 3, reps: "12–15", opts: ["Nackencurls mit Hantelscheibe", "Nackenextension mit Scheibe", "Nackenmaschine"] } ] },
  { day: 2, name: "Schultern & Trapez", slots: [
    { label: "Schulter seitlich (Abduktion)", sets: 4, reps: "8–10", opts: ["Schulterdrücken (Kurzhantel)", "Military Press (Langhantel)", "Arnold Press", "Schulterpresse (Maschine)"] },
    { label: "Schulter hinten (Retraktion)", sets: 4, reps: "8–10", opts: ["Reverse Butterfly (Maschine)", "Vorgebeugtes Seitheben", "Rudern zum Gesicht (breit)"] },
    { label: "Seitheben (Isolation)", sets: 3, reps: "12–15", opts: ["Seitheben (Kurzhantel)", "Seitheben am Kabel", "Seitheben (Maschine)"] },
    { label: "Face Pulls (Isolation)", sets: 3, reps: "12–15", opts: ["Face Pulls am Kabel", "Face Pulls mit Band"] },
    { label: "Trapez", sets: 3, reps: "10–12", opts: ["Shrugs (Kurzhantel)", "Shrugs (Langhantel)", "Aufrechtes Rudern"] } ] },
  { day: 3, name: "Beine & Waden", slots: [
    { label: "Beinpresse / Kniebeugen (schwer)", sets: 4, reps: "6–8", opts: ["Kniebeugen (Langhantel)", "Beinpresse", "Hackenschmidt-Kniebeuge"] },
    { label: "Beinstrecker (Quadrizeps)", sets: 3, reps: "10–12", opts: ["Beinstrecker (Maschine)"] },
    { label: "Beinbeuger (Hamstrings)", sets: 3, reps: "10–12", opts: ["Beinbeuger liegend", "Beinbeuger sitzend", "Rumänisches Kreuzheben"] },
    { label: "Ausfallschritte (oder Step-Ups)", sets: 3, reps: "12–15", opts: ["Ausfallschritte (Kurzhantel)", "Bulgarian Split Squats", "Step-Ups"] },

function viewKalender() {

  const key = isM ? `${ref.getFullYear()}-${pad(ref.getMonth() + 1)}` : String(ref.getFullYear());
  const title = isM ? ref.toLocaleDateString("de-DE", { month: "long", year: "numeric" }) : key;
  const list = S.sessions.filter((s) => s.date.startsWith(key));

    const r = rows[k] || (rows[k] = { name: k, color: s.type === "kraft" ? "var(--d1)" : sportColor(s), n: 0, min: 0, km: 0, hm: 0 });
    r.n++; r.min += num(s.duration) || 0; r.km += num(s.distance) || 0; r.hm += num(s.ascent) || 0;
  }
  const tot = Object.values(rows).reduce((a, r) => ({ n: a.n + r.n, min: a.min + r.min, km: a.km + r.km, hm: a.hm + r.hm }), { n: 0, min: 0, km: 0, hm: 0 });
  const kraft = list.filter((s) => s.type === "kraft"), kb = list.filter((s) => s.type === "kickboxen");
  const sets = kraft.reduce((a, s) => a + volume(s).n, 0), vol = kraft.reduce((a, s) => a + volume(s).v, 0);

    <div class="stats four">
      <div class="stat"><b>${tot.n}</b><span>Einheiten</span></div>
      <div class="stat"><b>${fmt(tot.min / 60)}</b><span>Stunden</span></div>
      <div class="stat"><b>${fmt(tot.km, 1)}</b><span>Kilometer</span></div>
      <div class="stat"><b>${fmt(tot.hm, 0)}</b><span>Höhenmeter</span></div>
    </div>
  </section>
  ${list.length ? `<section><div class="eyebrow">Nach Sportart</div><div class="card detail" style="overflow-x:auto"><table class="ov">
    <tr><th></th><th>Einh.</th><th>Std.</th><th>km</th><th>hm</th></tr>
    ${Object.values(rows).sort((a, b) => b.n - a.n).map((r) => `<tr><td><span class="daytag" style="font-family:var(--font-body);font-weight:500;font-size:15px"><span class="dot" style="--dc:${r.color}"></span>${esc(r.name)}</span></td><td>${r.n}</td><td>${fmt(r.min / 60)}</td><td>${r.km ? fmt(r.km, 1) : "–"}</td><td>${r.hm ? fmt(r.hm, 0) : "–"}</td></tr>`).join("")}
  </table></div></section>
  ${kraft.length ? `<section class="card"><h3>Kraft</h3><dl class="kv"><dt>Trainings</dt><dd>${kraft.length}</dd><dt>Sätze</dt><dd>${sets}</dd><dt>Bewegtes Gewicht</dt><dd>${fmt(vol / 1000, 1)} Tonnen</dd></dl></section>` : ""}
  ${kb.length ? `<section class="card"><h3>Kickboxen</h3><dl class="kv"><dt>Trainings</dt><dd>${kb.length}</dd><dt>Runden</dt><dd>${kb.reduce((a, s) => a + (num(s.rounds) || 0), 0) || "–"}</dd><dt>Mit Sparring</dt><dd>${kb.filter((s) => s.sparring).length}</dd><dt>Ø Intensität</dt><dd>${ints.length ? fmt(ints.reduce((a, b) => a + b, 0) / ints.length) + " von 10" : "–"}</dd></dl></section>` : ""}`
  : `<div class="empty">In diesem Zeitraum gibt es noch keine Einträge.</div>`}`;
}

// ---------- Speichern ----------
async function saveSettings(id, data) {
  if (!S.db) return;
  try { await S.db.doc("settings/" + id).set(data); } catch (e) { toast("Einstellung konnte nicht gespeichert werden."); }
}
function saveApp(patch) { S.app = { ...S.app, ...patch }; saveSettings("app", S.app); }
function rememberChoice(day, i, name) {
  S.plan = { ...S.plan, choices: { ...(S.plan.choices || {}), [slotKey(day, i)]: name } };
  saveSettings("plan", S.plan);
}
async function saveForm() {
  const f = S.form;
  if (!f.date) return toast("Bitte ein Datum wählen.");
  const doc = { type: f.type, date: f.date, time: f.time || "", duration: num(f.duration), note: f.note.trim(), images: f.images, updatedAt: new Date().toISOString() };
  if (f.type === "kraft") {
    const d = dayInfo(f.day);
    doc.day = f.day; doc.dayName = d.name;
    doc.exercises = f.slots.map((st, i) => ({
      slot: slotKey(f.day, i), slotLabel: d.slots[i].label, name: (st.name || "").trim(), target: `${d.slots[i].sets} × ${d.slots[i].reps}${d.slots[i].unit ? " " + d.slots[i].unit : ""}`, unit: d.slots[i].unit || "",
      sets: st.sets.map((s) => ({ kg: num(s.kg), reps: num(s.reps) })).filter((s) => s.reps != null),
    })).filter((e) => e.sets.length && e.name);
    if (!doc.exercises.length) return toast("Trag mindestens einen Satz ein.");
  } else {
    if (f.type === "sonstiges") doc.category = (f.category || "Sonstiges").trim();
    for (const k of ["distance", "ascent", "hrAvg", "hrMax", "kcal"]) doc[k] = num(f[k]);
    if (f.type === "kickboxen") { doc.rounds = num(f.rounds); doc.roundMin = num(f.roundMin); doc.sparring = f.sparring; doc.intensity = num(f.intensity); }
    doc.track = f.track || null;
  }
  const id = f.id || newId();
  const prs = newRecords(doc, id);
  const btn = $("[data-save]"); if (btn) btn.disabled = true;
  try {
    await S.db.doc("sessions/" + id).set({ ...doc, createdAt: S.sessions.find((s) => s.id === id)?.createdAt || doc.updatedAt });
    S.prs = prs.length ? prs : null;
    S.form = null; S.view = "start"; S.open = null; render(); window.scrollTo(0, 0); toast(prs.length ? "Gespeichert. Neuer Rekord!" : "Gespeichert");
  } catch (e) {
    if (btn) btn.disabled = false;
    toast(e?.code === "quota_exceeded" ? "Speicher voll. Bitte exportieren und alte Einträge löschen." : "Speichern hat nicht geklappt. Bitte nochmal versuchen.");
  }
}

function startPlanEdit() {
  S.planEdit = plan().map((d) => ({ name: d.name, slots: d.slots.map((s, i) => ({ label: s.label, sets: s.sets, reps: s.reps, unit: s.unit || "", opts: [...(s.opts || [])], _choice: choiceFor(d.day, i) })) }));
  S.planDay = Math.min(S.planDay, S.planEdit.length);
}
async function savePlanEdit() {
  const days = S.planEdit.map((d, i) => ({
    day: i + 1, name: d.name.trim() || `Tag ${i + 1}`,
    slots: d.slots.map((s) => ({ label: String(s.label || "").trim() || "Übung", sets: Math.max(1, Math.min(10, Math.round(num(s.sets) || 3))), reps: String(s.reps || "").trim().replace("-", "–") || "8–12", ...(s.unit ? { unit: s.unit } : {}), opts: s.opts, _choice: String(s._choice || "").trim() })),
  })).filter((d) => d.slots.length);
  if (!days.length) return toast("Der Plan braucht mindestens einen Tag mit einer Übung.");
  const choices = {};
  days.forEach((d) => d.slots.forEach((s, i) => { if (s._choice) { choices[slotKey(d.day, i)] = s._choice; if (!s.opts.includes(s._choice)) s.opts = [s._choice, ...s.opts]; } delete s._choice; }));
  S.plandef = { days }; S.plan = { choices };
  await saveSettings("plandef", S.plandef); await saveSettings("plan", S.plan);
  S.planEdit = null; render(); toast("Plan gespeichert");
}

// ---------- Bilder ----------
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const max = 1800, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((r) => c.toBlob((b) => r(b || file), "image/jpeg", 0.86));
  } catch (e) { return file; }
}
async function uploadImages(files) {
  const st = $("#img-status");
  for (const file of files) {
    if (st) st.textContent = "Lädt hoch …";
    try {
      const blob = await shrink(file);
      const res = await S.assets.upload(blob, blob.type ? undefined : { type: "image/jpeg" });
      if (res.url) BLOBURLS[res.id] = res.url;
      S.form.images = [...S.form.images, res.id];
    } catch (e) {
      toast(e?.code === "unsupported_type" ? "Dieses Bildformat geht nicht. Bitte als JPG oder PNG." : e?.code === "too_large" ? "Bild ist zu groß." : "Hochladen hat nicht geklappt.");
    }
  }
  render();
}

// ---------- Export ----------
function csv(rows) {
  const cell = (v) => { const s = v == null ? "" : typeof v === "number" ? String(v).replace(".", ",") : typeof v === "boolean" ? (v ? "ja" : "nein") : String(v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return "﻿" + rows.map((r) => r.map(cell).join(";")).join("\r\n");
}
async function doExport(kind) {
  const today = isoDay();
  let filename, data;
  if (kind === "json") { filename = `trainingsbuch-${today}.json`; data = JSON.stringify({ exportiert: new Date().toISOString(), sessions: sortSessions(S.sessions), body: S.body, plan: S.plan, plandef: S.plandef, app: { sports: S.app.sports, weekdays: S.app.weekdays, activeDays: S.app.activeDays } }, null, 2); }
  if (kind === "kraft") {
    const rows = [["Datum", "Tag", "Platz", "Übung", "Satz", "kg", "Wdh./Sek."]];
    sortSessions(S.sessions).filter((s) => s.type === "kraft").forEach((s) => s.exercises.forEach((e) => e.sets.forEach((x, k) => rows.push([s.date, s.day, e.slotLabel, e.name, k + 1, x.kg, x.reps]))));
    filename = `kraftsaetze-${today}.csv`; data = csv(rows);
  }
  if (kind === "einheiten") {
    const rows = [["Datum", "Uhrzeit", "Art", "Sportart / Tag", "Dauer (min)", "Strecke (km)", "Höhenmeter", "Puls Ø", "Puls max", "kcal", "Sätze", "Runden", "Sparring", "Intensität", "Notiz"]];
    sortSessions(S.sessions).forEach((s) => rows.push([s.date, s.time, typeName[s.type], s.type === "kraft" ? `Tag ${s.day}: ${s.dayName || dayInfo(s.day)?.name || ""}` : s.category || "", s.duration, s.distance, s.ascent, s.hrAvg, s.hrMax, s.kcal, s.type === "kraft" ? volume(s).n : "", s.rounds, s.sparring, s.intensity, s.note]));
    filename = `einheiten-${today}.csv`; data = csv(rows);
  }
  if (window.TB_LOCAL) {
    // Handy-App: Bilder kommen mit in die Sicherung, denn sie liegen nur auf diesem Gerät.
    // Das Teilen-Menü muss direkt aus einem Fingertipp starten, daher zweistufig: erst vorbereiten, dann teilen.
    if (kind === "json") { const j = JSON.parse(data); j.images = await S.assets.exportAll(S.sessions.flatMap((s) => s.images || [])); data = JSON.stringify(j); }
    READY = { filename, data, kind };
    $("#ready-t").textContent = `${filename} ist bereit (${(() => { const kb = new Blob([data]).size / 1024; return kb < 1024 ? fmt(kb, 0) + " KB" : fmt(kb / 1024, 1) + " MB"; })()})`;
    $("#ready").hidden = false;
    return;
  }
  return finishExport({ filename, data, kind });
}
let READY = null;
async function finishExport({ filename, data, kind }) {
  try {
    await S.downloads.save({ filename, data }); toast("Datei gespeichert");
    if (kind === "json") { saveApp({ lastBackup: isoDay() }); render(); }
  } catch (e) { if (e?.code !== "declined") toast("Export hat nicht geklappt."); }
}

// ---------- Import ----------
async function readImport(file) {
  try {
    const j = JSON.parse(await file.text());
    const ok = (x) => x && typeof x === "object" && typeof x.id === "string" && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(x.id) && /^\d{4}-\d{2}-\d{2}$/.test(x.date || "");
    const sessions = Array.isArray(j.sessions) ? j.sessions.filter((s) => ok(s) && typeName[s.type]) : [];
    const body = Array.isArray(j.body) ? j.body.filter(ok) : [];
    if (!sessions.length && !body.length) return toast("In der Datei wurden keine Trainingsdaten gefunden.");
    S.importData = { sessions, body, plan: j.plan && typeof j.plan.choices === "object" ? { choices: j.plan.choices } : null,
      plandef: Array.isArray(j.plandef?.days) && j.plandef.days.length ? { days: j.plandef.days } : null, app: j.app && typeof j.app === "object" ? j.app : null,
      images: window.TB_LOCAL && j.images && typeof j.images === "object" ? j.images : null };
  } catch (e) { toast("Die Datei ist keine gültige Sicherung."); }
  render();
}
async function runImport() {
  const d = S.importData, btn = $("[data-import-yes]"); if (btn) btn.disabled = true;
  let n = 0;
  try {
    for (const { id, ...rest } of d.sessions) { await S.db.doc("sessions/" + id).set(rest); n++; }
    for (const { id, ...rest } of d.body) { await S.db.doc("body/" + id).set(rest); n++; }
    if (d.images && S.assets?.importAll) await S.assets.importAll(d.images);
    if (d.plandef) { S.plandef = d.plandef; await saveSettings("plandef", S.plandef); }
    if (d.plan) { S.plan = { choices: d.plandef ? d.plan.choices : { ...(S.plan.choices || {}), ...d.plan.choices } }; await saveSettings("plan", S.plan); }
    if (d.app) { const p = {}; for (const k of ["sports", "weekdays", "activeDays"]) if (Array.isArray(d.app[k])) p[k] = d.app[k]; if (Object.keys(p).length) saveApp(p); }
    S.importData = null; render(); toast(`${n} Einträge eingespielt`);
  } catch (e) {
    S.importData = null; render();
    toast(e?.code === "quota_exceeded" ? `Speicher voll nach ${n} Einträgen.` : `Abgebrochen nach ${n} Einträgen. Bitte nochmal versuchen.`);
  }
}

// ---------- Ereignisse ----------
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button, [data-open]");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.view = d.tab; S.confirmDel = null; if (d.tab === "eintragen" && !S.form) S.form = newKraftForm(nextDay()); render(); window.scrollTo(0, 0); return; }
  if (d.go) { S.view = d.go; if (d.sub) S.fsub = d.sub; render(); window.scrollTo(0, 0); return; }
  if (d.new) { startForm(d.new, Number(d.day) || null, d.cat ? { category: d.cat } : undefined); if (d.date) { S.form.date = d.date; render(); } return; }
  if (d.prOk != null) { S.prs = null; return render(); }
  if (d.copylast != null) return copyLast();
  if (d.vsub) { S.vsub = d.vsub; return render(); }
  if (d.calnav) { const m = parseDay((S.calMonth || isoDay().slice(0, 7)) + "-01"); m.setMonth(m.getMonth() + Number(d.calnav)); S.calMonth = isoDay(m).slice(0, 7); S.calDay = null; return render(); }
  if (d.calday) { S.calDay = S.calDay === d.calday ? null : d.calday; S.open = null; return render(); }
  if (d.fsub) { S.fsub = d.fsub; return render(); }
  if (d.mweek) { S.mWeek = addDays(S.mWeek || weekStart(), Number(d.mweek)); return render(); }
  if (d.fsmetric) { S.fsMetric = d.fsmetric; return render(); }
  if (d.ovmode) { S.ovMode = d.ovmode; return render(); }
  if (d.ovnav) { const r = parseDay(S.ovRef || isoDay()); if (S.ovMode === "monat") { r.setDate(1); r.setMonth(r.getMonth() + Number(d.ovnav)); } else r.setFullYear(r.getFullYear() + Number(d.ovnav)); S.ovRef = isoDay(r); return render(); }
  if (d.spar != null) { S.form.sparring = d.spar === "null" ? null : d.spar === "true"; return render(); }
  if (d.pickwatch != null) return $("#f-watch").click();
  if (d.rmtrack != null) { S.form.track = null; return render(); }
  if (d.wd != null) { saveApp({ weekdays: toggleIn(weekdays(), Number(d.wd)).sort((a, b) => a - b) }); return render(); }
  if (d.act) { const next = toggleIn(activeDays(), Number(d.act)); if (!next.length) return toast("Mindestens ein Plan-Tag muss aktiv bleiben."); saveApp({ activeDays: next.sort((a, b) => a - b) }); return render(); }
  if (d.sportRm) { saveApp({ sports: sports().filter((k) => k !== d.sportRm) }); toast(`${d.sportRm} entfernt. Alte Einträge bleiben erhalten.`); return render(); }
  if (d.sportAdd != null) { const v = $("#s-new").value.trim(); if (!v) return; if (!sports().some((k) => k.toLowerCase() === v.toLowerCase())) saveApp({ sports: [...sports(), v] }); toast(`${v} hinzugefügt`); return render(); }
  if (d.newsportNo != null) { S.form.newSport = false; return render(); }
  if (d.newsportAdd != null) { const v = $("#f-newsport").value.trim(); if (!v) return; if (!sports().some((k) => k.toLowerCase() === v.toLowerCase())) saveApp({ sports: [...sports(), v] }); S.form.category = v; S.form.newSport = false; return render(); }
  if (d.type) { S.form = d.type === "kraft" ? newKraftForm(nextDay()) : newOtherForm(d.type); return render(); }
  if (d.dayPick) { newKraftForm(Number(d.dayPick), { date: S.form.date, time: S.form.time, duration: S.form.duration, note: S.form.note, images: S.form.images }); return render(); }
  if (d.addset != null) { const st = S.form.slots[d.addset]; const l = st.sets[st.sets.length - 1]; st.sets.push({ kg: l?.kg ?? "", reps: "", ph: l?.ph || "" }); return render(); }
  if (d.rmset) { const [i, k] = d.rmset.split("-").map(Number); S.form.slots[i].sets.splice(k, 1); return render(); }
  if (d.cancel != null) { S.form = null; S.view = "start"; return render(); }
  if (d.save != null) return saveForm();
  if (d.pickimg != null) return $("#f-img").click();
  if (d.rmimg) { S.form.images = S.form.images.filter((x) => x !== d.rmimg); return render(); }
  if (d.filter) { S.filter = d.filter; return render(); }
  if (d.edit) { const s = S.sessions.find((x) => x.id === d.edit); if (s) startForm(s.type, s.day, s); return; }
  if (d.del) { S.confirmDel = d.del; return render(); }
  if (d.delNo != null) { S.confirmDel = null; return render(); }
  if (d.delYes) { try { await S.db.doc("sessions/" + d.delYes).delete(); S.confirmDel = null; S.open = null; toast("Gelöscht"); } catch (e) { toast("Löschen hat nicht geklappt."); } return; }
  if (d.open && !ev.target.closest("[data-stop]")) { S.open = S.open === d.open ? null : d.open; S.confirmDel = null; return render(); }
  if (d.bodySave != null) {
    const date = $("#b-date").value, weight = num($("#b-kg").value), fat = num($("#b-kfa").value);
    if (!date || (weight == null && fat == null)) return toast("Bitte Gewicht oder Körperfett eintragen.");
    try { await S.db.doc("body/" + newId()).set({ date, weight, fat, createdAt: new Date().toISOString() }); toast("Messung gespeichert"); } catch (e) { toast("Speichern hat nicht geklappt."); }
    return;
  }
  if (d.bdel) { try { await S.db.doc("body/" + d.bdel).delete(); } catch (e) { toast("Löschen hat nicht geklappt."); } return; }
  if (d.themePick) { applyTheme(d.themePick); saveApp({ theme: d.themePick }); return render(); }
  if (d.planday) { S.planDay = Number(d.planday); return render(); }
  if (d.peStart != null) { startPlanEdit(); return render(); }
  if (S.planEdit) {
    const day = S.planEdit[S.planDay - 1];
    if (d.peCancel != null) { S.planEdit = null; return render(); }
    if (d.peSave != null) return savePlanEdit();
    if (d.peAdd != null) { day.slots.push({ label: "", sets: 3, reps: "10–12", unit: "", opts: [], _choice: "" }); return render(); }
    if (d.peRm != null) { day.slots.splice(Number(d.peRm), 1); return render(); }
    if (d.peUp != null || d.peDown != null) { const i = Number(d.peUp ?? d.peDown), j = d.peUp != null ? i - 1 : i + 1; [day.slots[i], day.slots[j]] = [day.slots[j], day.slots[i]]; return render(); }
    if (d.peAddday != null) { S.planEdit.push({ name: `Tag ${S.planEdit.length + 1}`, slots: [{ label: "", sets: 3, reps: "8–12", unit: "", opts: [], _choice: "" }] }); S.planDay = S.planEdit.length; return render(); }
    if (d.peRmday != null) { S.planEdit.splice(S.planDay - 1, 1); S.planDay = Math.max(1, S.planDay - 1); return render(); }
    if (d.peReset != null) { S.planEdit = DEFAULT_PLAN.map((dd) => ({ name: dd.name, slots: dd.slots.map((s) => ({ ...s, unit: s.unit || "", opts: [...s.opts], _choice: s.opts[0] })) })); S.planDay = 1; toast("Ursprünglicher Plan geladen. Zum Übernehmen „Plan speichern“."); return render(); }
  }
  if (d.cloudEdit != null) { S.cloudEdit = true; return render(); }
  if (d.cloudCancel != null) { S.cloudEdit = false; return render(); }
  if (d.cloudSave != null) {
    S.cloud = { provider: $("#c-prov").value, user: $("#c-user").value.trim(), note: $("#c-note").value.trim(), updatedAt: new Date().toISOString() };
    S.cloudEdit = false; await saveSettings("cloud", S.cloud); render(); toast("Konto gespeichert"); return;
  }
  if (d.export) return doExport(d.export);
  if (d.readyGo != null && READY) { const r = READY; READY = null; $("#ready").hidden = true; return finishExport(r); }
  if (d.readyX != null) { READY = null; $("#ready").hidden = true; return; }
  if (d.pickimport != null) return $("#f-import").click();
  if (d.importNo != null) { S.importData = null; return render(); }
  if (d.importYes != null) return runImport();
});
document.addEventListener("keydown", (ev) => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-open]")) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener("input", (ev) => {
  const el = ev.target, d = el.dataset;
  if (S.planEdit && (d.pe || d.peName != null)) {
    const day = S.planEdit[S.planDay - 1];
    if (d.peName != null) day.name = el.value; else day.slots[Number(d.pi)][d.pe] = el.value;
    return;
  }
  const f = S.form;
  if (!f) return;
  if (d.f) f[d.f] = el.value;
  if (d.f === "intensity") { f.intensity = Number(el.value); const o = $("#int-val"); if (o) o.textContent = el.value + " von 10"; }
  if (d.kg) { const [i, k] = d.kg.split("-").map(Number); f.slots[i].sets[k].kg = el.value; }
  if (d.rp) { const [i, k] = d.rp.split("-").map(Number); f.slots[i].sets[k].reps = el.value; }
  if (d.exc) f.slots[d.exc].name = el.value;
});
document.addEventListener("change", (ev) => {
  const el = ev.target, d = el.dataset, f = S.form;
  if (d.fsex != null) { S.fsEx = el.value; return render(); }
  if (S.planEdit && d.pe === "unit") { S.planEdit[S.planDay - 1].slots[Number(d.pi)].unit = el.value; return; }
  if (d.ex != null && f) {
    const i = Number(d.ex);
    if (el.value === "__custom") { f.slots[i] = { ...f.slots[i], custom: true, name: "" }; render(); $("#exc-" + i)?.focus(); return; }
    f.slots[i] = makeSlotState(f.day, i, el.value); rememberChoice(f.day, i, el.value); return render();
  }
  if (d.exc != null && f) { const i = Number(d.exc), name = el.value.trim(); if (name) { f.slots[i] = { ...makeSlotState(f.day, i, name), custom: true }; rememberChoice(f.day, i, name); render(); } return; }
  if (d.catsel != null && f) { if (el.value === "__new") { f.newSport = true; render(); $("#f-newsport")?.focus(); } else f.category = el.value; return; }
  if (d.planslot) { const [day, i] = d.planslot.split("-").map(Number); rememberChoice(day, i, el.value); toast("Übung gemerkt"); return; }
  if (el.id === "f-img" && el.files?.length) uploadImages([...el.files]);
  if (el.id === "f-watch" && el.files?.[0]) importWatchFile(el.files[0]);
  if (el.id === "f-import" && el.files?.[0]) readImport(el.files[0]);
});

// ---------- Start ----------
render();
(async () => {
  const [db, assets, downloads] = window.TB_LOCAL ? await window.TB_LOCAL.caps() : await Promise.all(["db", "assets", "downloads"].map((n) => window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null)));
  S.db = db; S.assets = assets; S.downloads = downloads; S.ok = !!db;
  if (window.TB_LOCAL) S.persisted = await window.TB_LOCAL.persisted();
  if (!db) { $("#status").textContent = "Nur Ansicht"; render(); return; }
  $("#status").textContent = window.TB_LOCAL ? "Auf diesem Gerät" : "Synchron";
  // Falls das Formular schon offen ist, nur den Speichern-Knopf freigeben (Eingaben bleiben erhalten)
  if (S.view === "eintragen") { const sb = $("[data-save]"); if (sb) sb.disabled = false; $("#nosave")?.remove(); }
  const onErr = () => { $("#status").textContent = "Offline"; };
  const quiet = () => S.view === "eintragen" || S.cloudEdit || S.planEdit;
  db.collection("sessions").onSnapshot((snap) => { S.sessions = snap.docs.map((x) => ({ id: x.id, ...x.data() })); if (!quiet()) render(); }, onErr);
  db.collection("body").onSnapshot((snap) => { S.body = snap.docs.map((x) => ({ id: x.id, ...x.data() })); if (!quiet()) render(); }, onErr);
  db.collection("settings").onSnapshot((snap) => {
    for (const x of snap.docs) {
      if (x.id === "plan") S.plan = { choices: {}, ...x.data() };
      if (x.id === "plandef") S.plandef = x.data();
      if (x.id === "app") { S.app = { ...x.data() }; applyTheme(S.app.theme || "system"); }
      if (x.id === "cloud") S.cloud = { ...x.data() };
    }
    if (!quiet()) render();
  }, onErr);
})();
</script>
